<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>여행상품 가격비교</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #F7F7F8;
  --surface:     #FFFFFF;
  --surface2:    #F4F4F5;
  --ink:         #09090B;
  --ink2:        #52525B;
  --ink3:        #A1A1AA;
  --border:      #E4E4E7;
  --border2:     #D4D4D8;
  --accent:      #E85427;
  --accent-dim:  #FFF1EE;
  --green:       #16A34A;
  --green-bg:    #F0FDF4;
  --green-border:#BBF7D0;
  --red:         #DC2626;
  --red-bg:      #FEF2F2;
  --red-border:  #FECACA;
  --yellow:      #D97706;
  --yellow-bg:   #FFFBEB;
  --radius-sm:   6px;
  --radius:      10px;
  --radius-lg:   14px;
  --shadow-xs:   0 1px 2px rgba(0,0,0,.05);
  --shadow-sm:   0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md:   0 4px 12px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.04);
}

body {
  font-family: 'Pretendard', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

/* ── 상단 바 ── */
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 8px;
  position: sticky;
  top: 0;
  z-index: 10;
}
.topbar-logo {
  display: flex;
  align-items: center;
  gap: 8px;
}
.logo-icon {
  width: 28px; height: 28px;
  background: var(--accent);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}
.logo-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -.2px;
}
.topbar-sep {
  width: 1px;
  height: 16px;
  background: var(--border);
  margin: 0 4px;
}
.topbar-sub {
  font-size: 12px;
  color: var(--ink3);
}

/* ── 히어로 영역 ── */
.hero {
  max-width: 680px;
  margin: 0 auto;
  padding: 3.5rem 1.5rem 2rem;
  text-align: center;
}
.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--accent);
  background: var(--accent-dim);
  padding: 4px 12px;
  border-radius: 20px;
  letter-spacing: .3px;
  margin-bottom: 1.2rem;
}
.hero h1 {
  font-size: 2rem;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -.6px;
  line-height: 1.25;
  margin-bottom: .6rem;
}
.hero p {
  font-size: 14px;
  color: var(--ink2);
  font-weight: 300;
  line-height: 1.7;
}

/* ── 검색 카드 ── */
.search-card {
  max-width: 680px;
  margin: 0 auto 1rem;
  padding: 0 1.5rem;
}
.search-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: 1.2rem 1.4rem;
}
.field-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--ink3);
  letter-spacing: 1px;
  text-transform: uppercase;
  display: block;
  margin-bottom: 6px;
}
.search-row {
  display: flex;
  gap: 8px;
  align-items: stretch;
}
.search-input {
  flex: 1;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: .75rem 1rem;
  font-size: 14px;
  font-family: inherit;
  color: var(--ink);
  background: var(--bg);
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.search-input::placeholder { color: var(--ink3); font-size: 13px; }
.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(232,84,39,.08);
  background: var(--surface);
}
.btn-primary {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 0 1.4rem;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: background .15s, transform .1s;
  white-space: nowrap;
  letter-spacing: .2px;
}
.btn-primary:hover { background: #d14920; }
.btn-primary:active { transform: scale(.98); }
.btn-primary:disabled { background: var(--border2); cursor: not-allowed; color: var(--ink3); }

.divider-row {
  height: 1px;
  background: var(--border);
  margin: 1rem 0;
}
.price-row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.price-input-wrap {
  display: flex;
  align-items: center;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  padding: .6rem .9rem;
  gap: 5px;
  transition: border-color .15s, box-shadow .15s;
}
.price-input-wrap:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(232,84,39,.08);
  background: var(--surface);
}
.price-prefix { font-size: 13px; color: var(--ink2); font-weight: 500; }
#hanatourPrice {
  border: none; outline: none;
  font-family: inherit; font-size: 13px;
  width: 120px; color: var(--ink);
  background: transparent;
}
#hanatourPrice::placeholder { color: var(--ink3); }
.price-hint {
  font-size: 12px;
  color: var(--ink3);
  flex: 1;
}


/* ── 분석 태그 ── */
.analyzed-wrap {
  max-width: 680px;
  margin: 1rem auto 0;
  padding: 0 1.5rem;
}
.analyzed-inner {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  padding: .7rem 1rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.analyzed-label {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink3);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-right: 2px;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
}
.pill-green  { background: var(--green-bg);  color: var(--green);  border: 1px solid var(--green-border); }
.pill-orange { background: var(--accent-dim); color: var(--accent); border: 1px solid #FFCDB8; }
.pill-yellow { background: var(--yellow-bg);  color: var(--yellow); border: 1px solid #FDE68A; }
.pill-gray   { background: var(--surface2);   color: var(--ink2);   border: 1px solid var(--border); }
.pill-ai     { background: #EEF2FF; color: #4F46E5; border: 1px solid #C7D2FE; }
.pill-custom { background: #EFF6FF; color: #2563EB; border: 1px solid #BFDBFE; display: inline-flex; align-items: center; gap: 4px; }
.pill-custom .rm { cursor: pointer; opacity: 0.5; font-size: 13px; line-height: 1; }
.pill-custom .rm:hover { opacity: 1; }
.add-cond-btn { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; border: 1.5px dashed var(--border); color: var(--ink3); font-size: 16px; cursor: pointer; transition: border-color .15s, color .15s; flex-shrink: 0; }
.add-cond-btn:hover { border-color: var(--accent); color: var(--accent); }
.cond-input { font-size: 12px; border: 1px solid var(--accent); border-radius: 12px; padding: 2px 10px; outline: none; width: 130px; }

/* ── 결과 래퍼 ── */
.results-wrap {
  max-width: 680px;
  margin: 1.2rem auto 4rem;
  padding: 0 1.5rem;
}

/* 통계 카드 */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 1.4rem;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: .9rem 1rem;
  box-shadow: var(--shadow-xs);
}
.stat-label {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink3);
  letter-spacing: .8px;
  text-transform: uppercase;
  margin-bottom: 5px;
}
.stat-value {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -.4px;
}
.stat-card.accent-card .stat-value { color: var(--accent); }
.stat-card.green-card  .stat-value { color: var(--green); }
.stat-card.red-card    .stat-value { color: var(--red); }

/* 등급 구분선 */
.grade-section { margin-bottom: 1.6rem; }
.grade-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: .6rem;
}
.grade-badge {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  letter-spacing: .3px;
}
.badge-green  { background: var(--green-bg);  color: var(--green);  border: 1px solid var(--green-border); }
.badge-yellow { background: var(--yellow-bg);  color: var(--yellow); border: 1px solid #FDE68A; }
.badge-red    { background: var(--red-bg);    color: var(--red);    border: 1px solid var(--red-border); }
.grade-line { flex: 1; height: 1px; background: var(--border); }

/* 상품 카드 */
.product-card {
  display: grid;
  grid-template-columns: 28px 72px 1fr auto;
  gap: 12px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.2rem;
  margin-bottom: 6px;
  text-decoration: none;
  color: inherit;
  box-shadow: var(--shadow-xs);
  transition: border-color .15s, box-shadow .15s, transform .12s;
  animation: fadeUp .2s ease both;
}
.product-card:hover {
  border-color: var(--accent);
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.product-card:nth-child(2) { animation-delay: .04s; }
.product-card:nth-child(3) { animation-delay: .08s; }
.product-card:nth-child(4) { animation-delay: .12s; }
.product-card:nth-child(5) { animation-delay: .16s; }

.rank {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--surface2);
  font-size: 11px;
  font-weight: 700;
  color: var(--ink3);
  display: flex; align-items: center; justify-content: center;
}
.rank-1 { background: #FEF3C7; color: #B45309; }

.thumb-wrap { position: relative; }
.thumb {
  width: 72px; height: 56px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  display: block;
}
.thumb-placeholder {
  width: 72px; height: 56px;
  border-radius: var(--radius-sm);
  background: var(--surface2);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.4rem;
  color: var(--ink3);
}

.card-body { overflow: hidden; min-width: 0; }
.card-mall {
  font-size: 10px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 1.2px;
  text-transform: uppercase;
  margin-bottom: 3px;
}
.card-title {
  font-size: 13px;
  font-weight: 400;
  line-height: 1.5;
  color: var(--ink);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.sim-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 5px;
}
.sim-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
.dot-green  { background: var(--green); }
.dot-yellow { background: var(--yellow); }
.dot-red    { background: #F87171; }
.sim-text { font-size: 11px; color: var(--ink3); }

.card-price-col { text-align: right; white-space: nowrap; min-width: 110px; }
.price-main {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: -.4px;
}
.price-sub {
  font-size: 10.5px;
  color: var(--ink3);
  margin-top: 1px;
}
.best-tag {
  display: inline-block;
  background: var(--green-bg);
  color: var(--green);
  border: 1px solid var(--green-border);
  font-size: 10px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 4px;
  margin-top: 3px;
}
.diff-higher {
  font-size: 11px;
  color: var(--ink3);
  margin-top: 2px;
}
.hana-cheaper {
  font-size: 11px;
  font-weight: 600;
  color: var(--green);
  margin-top: 3px;
}
.hana-pricier {
  font-size: 11px;
  font-weight: 600;
  color: var(--red);
  margin-top: 3px;
}
.hana-same {
  font-size: 11px;
  color: var(--ink3);
  margin-top: 3px;
}

/* 빈 상태 / 로딩 / 에러 */
.empty {
  text-align: center;
  padding: 5rem 1rem 3rem;
  color: var(--ink3);
}
.empty-icon {
  font-size: 2.5rem;
  margin-bottom: 1rem;
  opacity: .4;
}
.empty h3 {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink2);
  margin-bottom: .4rem;
}
.empty p { font-size: 13px; line-height: 1.7; }

.loading-wrap { text-align: center; padding: 4rem 1rem; }
.spinner {
  width: 28px; height: 28px;
  border: 2.5px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 0 auto 1rem;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 13px; color: var(--ink3); }

.error-card {
  background: var(--red-bg);
  border: 1px solid var(--red-border);
  border-radius: var(--radius);
  padding: 1rem 1.2rem;
  color: var(--red);
  font-size: 13px;
  line-height: 1.7;
}

/* 푸터 */
footer {
  border-top: 1px solid var(--border);
  text-align: center;
  padding: 1.4rem;
  font-size: 11.5px;
  color: var(--ink3);
}
</style>
</head>
<body>

<!-- 상단 바 -->
<nav class="topbar">
  <div class="topbar-logo">
    <div class="logo-icon">✈</div>
    <span class="logo-name">PriceCheck</span>
  </div>
  <div class="topbar-sep"></div>
  <span class="topbar-sub">하나투어 상품 가격비교</span>
</nav>

<!-- 히어로 -->
<div class="hero">
  <div class="hero-eyebrow">
    <span>●</span> Naver Shopping 실시간 비교
  </div>
  <h1>타사 가격, 한 번에 확인</h1>
  <p>하나투어 상품명을 붙여넣으면<br>네이버 쇼핑 동일 상품과 가격을 자동 비교합니다.</p>
</div>

<!-- 검색 카드 -->
<div class="search-card">
  <div class="search-box">
    <label class="field-label" for="searchInput">하나투어 상품명</label>
    <div class="search-row">
      <input
        id="searchInput"
        class="search-input"
        type="text"
        placeholder="예: [즉시확정][일본] 오사카 유니버셜스튜디오 재팬 입장권 티켓"
        autocomplete="off"
      />
      <button class="btn-primary" id="searchBtn" onclick="doSearch()">비교하기</button>
    </div>
    <div class="divider-row"></div>
    <label class="field-label">하나투어 판매가 <span style="font-weight:400;color:var(--ink3);text-transform:none;letter-spacing:0">(선택 — 입력하면 차액을 표시합니다)</span></label>
    <div class="price-row">
      <div class="price-input-wrap">
        <span class="price-prefix">₩</span>
        <input id="hanatourPrice" type="number" min="0" step="100" placeholder="예: 89000" />
      </div>
    </div>
  </div>
</div>


<!-- 분석 태그 -->
<div class="analyzed-wrap" id="analyzedWrap" style="display:none"></div>

<!-- 결과 -->
<div class="results-wrap" id="resultsWrap">
  <div class="empty">
    <div class="empty-icon">✈</div>
    <h3>상품명을 입력해주세요</h3>
    <p>상품명을 붙여넣고 비교하기를 누르면<br>네이버 쇼핑에서 동일·유사 상품을 찾아 가격을 비교합니다.</p>
  </div>
</div>

<footer>네이버 쇼핑 API 기반 · 가격은 실시간 변동됩니다 · 시즌/대상 미명시 시 유사 상품으로 분류</footer>

<script>

document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

function fmt(n) { return Number(n).toLocaleString('ko-KR'); }

let customConditions = [];
let lastSearchQ = '';
let lastAnalyzed = null;

function renderConditions() {
  if (!lastAnalyzed) return;
  const a = lastAnalyzed;
  const wrap = document.getElementById('analyzedWrap');
  const tags = [];
  if (a.ticketType) tags.push(`<span class="pill pill-green">🎫 ${a.ticketType}</span>`);
  if (a.target)     tags.push(`<span class="pill pill-green">👤 ${a.target}</span>`);
  if (a.season)     tags.push(`<span class="pill pill-yellow">📅 ${a.season}</span>`);
  if (a.isInstant)  tags.push(`<span class="pill pill-orange">⚡ 즉시확정</span>`);
  a.extras.forEach(e => tags.push(`<span class="pill pill-gray">+ ${e}</span>`));
  customConditions.forEach((c, i) => tags.push(
    `<span class="pill pill-custom">${c}<span class="rm" onclick="removeCondition(${i})">×</span></span>`
  ));
  if (!tags.length) tags.push(`<span class="pill pill-gray">조건 미명시 — 유사 상품으로 검색</span>`);
  const aiTag = a.aiUsed ? `<span class="pill pill-ai">🤖 AI 분석</span>` : '';

  wrap.style.display = 'block';
  wrap.innerHTML = `
    <div class="analyzed-inner">
      <span class="analyzed-label">추출 조건</span>
      ${tags.join('')}
      ${aiTag}
      <span class="add-cond-btn" onclick="showCondInput(this)" title="조건 추가">+</span>
      <span class="cond-input-wrap" style="display:none;align-items:center;">
        <input class="cond-input" type="text" placeholder="조건 입력 후 Enter"
               onkeydown="handleCondInput(event,this)"
               onblur="setTimeout(()=>hideCondInput(this.parentElement),150)">
      </span>
    </div>
  `;
}

function renderAnalyzed(a) {
  lastAnalyzed = a;
  renderConditions();
}

function showCondInput(btn) {
  const wrap = btn.nextElementSibling;
  wrap.style.display = 'inline-flex';
  btn.style.display = 'none';
  wrap.querySelector('input').focus();
}

function hideCondInput(wrap) {
  wrap.style.display = 'none';
  const btn = wrap.previousElementSibling;
  if (btn) btn.style.display = '';
}

function handleCondInput(e, input) {
  if (e.key === 'Enter') {
    const v = input.value.trim();
    if (v && !customConditions.includes(v)) {
      customConditions.push(v);
      renderConditions();
      doSearch();
    } else {
      hideCondInput(input.parentElement);
    }
  } else if (e.key === 'Escape') {
    hideCondInput(input.parentElement);
  }
}

function removeCondition(i) {
  customConditions.splice(i, 1);
  renderConditions();
  doSearch();
}

function renderResults(data) {
  const wrap = document.getElementById('resultsWrap');
  const { items, stats } = data;

  if (!items || items.length === 0) {
    wrap.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><h3>검색 결과가 없습니다</h3><p>다른 키워드로 시도해보세요.</p></div>`;
    return;
  }

  const sameItems     = items.filter(i => i.similarity.grade === '🟢');
  const simItems      = items.filter(i => i.similarity.grade === '🟡');
  const refItems      = items.filter(i => i.similarity.grade === '🔴');
  const minPrice      = stats.minPrice;
  const hanatourPrice = stats.hanatourPrice || null;

  function dotClass(grade) {
    if (grade === '🟢') return 'dot-green';
    if (grade === '🟡') return 'dot-yellow';
    return 'dot-red';
  }

  function cardHTML(item, idx) {
    const isFirst = idx === 0 && item.similarity.grade === '🟢';
    const diff = minPrice ? item.price - minPrice : null;
    let diffHTML = '';
    if (diff === null) {
      diffHTML = '';
    } else if (diff === 0) {
      diffHTML = `<div class="best-tag">최저가</div>`;
    } else {
      diffHTML = `<div class="diff-higher">+${fmt(diff)}원</div>`;
    }

    let hanaHTML = '';
    if (hanatourPrice) {
      const hd  = item.price - hanatourPrice;
      const pct = Math.round(Math.abs(hd) / hanatourPrice * 100);
      if (hd < 0) {
        hanaHTML = `<div class="hana-cheaper">↓ ${fmt(-hd)}원 저렴 (${pct}%)</div>`;
      } else if (hd > 0) {
        hanaHTML = `<div class="hana-pricier">↑ ${fmt(hd)}원 비쌈 (${pct}%)</div>`;
      } else {
        hanaHTML = `<div class="hana-same">= 동일가</div>`;
      }
    }

    return `
      <a class="product-card" href="${item.link}" target="_blank" rel="noopener">
        <div class="rank ${isFirst ? 'rank-1' : ''}">${idx + 1}</div>
        <div class="thumb-wrap">
          ${item.image
            ? `<img class="thumb" src="${item.image}" alt=""
                onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
            : ''}
          <div class="thumb-placeholder" ${item.image ? 'style="display:none"' : ''}>🎫</div>
        </div>
        <div class="card-body">
          <div class="card-mall">${item.mall || '쇼핑몰'}</div>
          <div class="card-title">${item.title}</div>
          <div class="sim-row">
            <div class="sim-dot ${dotClass(item.similarity.grade)}"></div>
            <span class="sim-text">${item.similarity.label}</span>
          </div>
        </div>
        <div class="card-price-col">
          <div class="price-main">₩${fmt(item.price)}</div>
          ${diffHTML}
          ${hanaHTML}
        </div>
      </a>
    `;
  }

  let html = '';

  // 통계 카드
  if (hanatourPrice && sameItems.length > 0) {
    const saving    = hanatourPrice - stats.minPrice;
    const savingPct = Math.round(Math.abs(saving) / hanatourPrice * 100);
    html += `
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">하나투어 판매가</div>
          <div class="stat-value">₩${fmt(hanatourPrice)}</div>
        </div>
        <div class="stat-card accent-card">
          <div class="stat-label">타사 최저가</div>
          <div class="stat-value">₩${fmt(stats.minPrice)}</div>
        </div>
        <div class="stat-card ${saving >= 0 ? 'green-card' : 'red-card'}">
          <div class="stat-label">하나투어 대비 ${saving >= 0 ? '최대 절약' : '추가 비용'}</div>
          <div class="stat-value">${saving >= 0 ? '-' : '+'}₩${fmt(Math.abs(saving))} <span style="font-size:.85rem">(${savingPct}%)</span></div>
        </div>
      </div>
    `;
  } else if (sameItems.length > 0) {
    html += `
      <div class="stats-grid">
        <div class="stat-card accent-card">
          <div class="stat-label">동일상품 최저가</div>
          <div class="stat-value">₩${fmt(stats.minPrice)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">동일상품 최고가</div>
          <div class="stat-value">₩${fmt(stats.maxPrice)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">가격 차이</div>
          <div class="stat-value">₩${fmt(stats.maxPrice - stats.minPrice)}</div>
        </div>
      </div>
    `;
  }

  // 동일 상품
  if (sameItems.length) {
    html += `
      <div class="grade-section">
        <div class="grade-header">
          <span class="grade-badge badge-green">동일 상품 ${sameItems.length}건</span>
          <div class="grade-line"></div>
        </div>
        ${sameItems.map((item, i) => cardHTML(item, i)).join('')}
      </div>
    `;
  }

  // 유사 상품
  if (simItems.length) {
    html += `
      <div class="grade-section">
        <div class="grade-header">
          <span class="grade-badge badge-yellow">유사 상품 ${simItems.length}건</span>
          <div class="grade-line"></div>
        </div>
        ${simItems.map((item, i) => cardHTML(item, i)).join('')}
      </div>
    `;
  }

  // 참고 상품
  if (refItems.length) {
    html += `
      <div class="grade-section">
        <div class="grade-header">
          <span class="grade-badge badge-red">참고 상품 ${refItems.length}건</span>
          <div class="grade-line"></div>
        </div>
        ${refItems.map((item, i) => cardHTML(item, i)).join('')}
      </div>
    `;
  }

  wrap.innerHTML = html;
}

async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) { alert('상품명을 입력해주세요.'); return; }

  if (q !== lastSearchQ) {
    customConditions = [];
    lastSearchQ = q;
  }

  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  btn.textContent = '검색 중...';

  document.getElementById('analyzedWrap').style.display = 'none';
  document.getElementById('resultsWrap').innerHTML = `
    <div class="loading-wrap">
      <div class="spinner"></div>
      <div class="loading-text">상품 분석 및 네이버 쇼핑 검색 중...</div>
    </div>
  `;

  try {
    const hanatourPrice = document.getElementById('hanatourPrice').value.trim();
    const extraParam = customConditions.length ? `&extra=${encodeURIComponent(customConditions.join(','))}` : '';
    const apiUrl = `/api/compare?q=${encodeURIComponent(q)}${hanatourPrice ? `&hanatourPrice=${hanatourPrice}` : ''}${extraParam}`;
    const res  = await fetch(apiUrl);
    const data = await res.json();

    if (data.error) throw new Error(data.error);

    renderAnalyzed(data.analyzed);
    renderResults(data);
  } catch (err) {
    document.getElementById('resultsWrap').innerHTML = `
      <div class="error-card">
        <strong>오류가 발생했습니다</strong><br>${err.message}<br><br>
        <small>.env 파일의 NAVER_CLIENT_ID / NAVER_CLIENT_SECRET을 확인해주세요.</small>
      </div>
    `;
  } finally {
    btn.disabled = false;
    btn.textContent = '비교하기';
  }
}
</script>
</body>
</html>
